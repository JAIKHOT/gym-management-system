{% extends "base.html" %}
{% block content %}

<h3>Payments</h3>

<!-- Add Payment Form -->
<div class="card mb-4">
  <div class="card-header bg-dark text-white">
    <strong>💰 Record New Payment</strong>
  </div>
  <div class="card-body">
    <form action="/add_payment" method="POST" class="row g-2">
      <div class="col-md-4">
        <select name="member_id" class="form-select" required>
          <option value="">Select member</option>
          {% for m in members %}
            <option value="{{ m.member_id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <input type="number" step="0.01" name="amount"
               class="form-control" placeholder="Amount (₹)" required>
      </div>
      <div class="col-md-3">
        <select name="mode" class="form-select" required>
          <option value="">Payment mode</option>
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Card">Card</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100">Record</button>
      </div>
    </form>
  </div>
</div>

<!-- Payments Table -->
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Payment ID</th><th>Member</th><th>Amount</th>
      <th>Date</th><th>Mode</th>
    </tr>
  </thead>
  <tbody>
    {% for p in payments %}
    <tr>
      <td>{{ p.payment_id }}</td>
      <td>{{ p.member_name }}</td>
      <td>₹{{ p.amount }}</td>
      <td>{{ p.payment_date }}</td>
      <td>{{ p.mode }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
